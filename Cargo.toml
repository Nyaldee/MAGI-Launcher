[package]
name = "magi-launcher"
version = "1.0.0"
edition = "2021"
description = "MAGI Launcher — fast keyboard-only application launcher for Windows"
license = "GPL-3.0-or-later"

[[bin]]
name = "magi_launcher"
path = "src/main.rs"

[dependencies]
# Win32_System_Registry : requise par ShellExecuteExW malgré son nom (aucun
# usage du Registre dans le code). Win32_System_Ioctl/IO : DeviceIoControl
# pour l'éjection USB (core::disk_ejector). Win32_System_Com : CoTaskMemFree
# pour SHGetKnownFolderPath (core::launch::known_folder).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Com",
] }

# Build-only : embarque Icon.ico comme ressource Windows -- jamais lié au
# binaire final.
[build-dependencies]
winresource = "0.1"

# Binaire compact, sans rien qui ressemble à un dropper pour un antivirus
# heuristique.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
